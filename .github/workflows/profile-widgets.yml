name: profile-widgets

on:
  schedule:
    - cron: "17 3 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-widgets.yml"]

permissions:
  contents: write

concurrency:
  group: profile-widgets
  cancel-in-progress: false

jobs:
  summary-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: 0

  notable-contributions:
    needs: summary-cards
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }} # classic PAT: public_repo, read:user
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics/notable.svg
          base: ""
          repositories_batch: 25 # first:100 makes the notable GraphQL query time out (502)
          config_timezone: Europe/London
          plugins_errors_fatal: yes # a failed API call retries instead of committing an error card
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_types: pull_request, commit
          plugin_notable_repositories: yes

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
